<body>
  <header class="kopfzeile">
    <div class="app-marke">
      <span class="logo" aria-hidden="true">▦</span>

    <div class="projekt" id="projekt-name"></div>
    <nav class="navigation" id="navigation">
      <a href="#/uebersicht" data-bereich="uebersicht">Übersicht</a>

    </nav>

  <div id="meldung" class="meldung" role="status" hidden></div>

  <main id="inhalt" class="inhalt">
    <p class="leer">Wird geladen …</p>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <div id="dialog-inhalt"></div>
    </form>

  <datalist id="geschosse">
    <option value="UG2"><option value="UG"><option value="KG"><option value="TG"><option value="EG">

  </datalist>
  <datalist id="gewerke"></datalist>
  <datalist id="firmen"></datalist>

  <script src="/static/vendor/pdfjs/pdf.min.js"></script>
  <script src="/static/app.js"></script>

</html>
